<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石伊冉 Shi Yiran — Growth Marketer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Serif+SC:wght@600;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#131A24;
    --accent:#2456E5;
    --slate:#55647E;
    --mist:#E4E8EF;
    --card:#F5F7FA;
    --max:1080px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans',-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

  /* ---------- Nav ---------- */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--mist);
  }
  .nav-inner{
    max-width:var(--max);margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-mark{display:flex;align-items:baseline;gap:9px}
  .nav-mark .zh{
    font-family:'Noto Serif SC',serif;font-weight:900;
    font-size:17px;letter-spacing:.12em;
  }
  .nav-mark .en{
    font-family:'Archivo',sans-serif;
    font-variation-settings:'wdth' 120,'wght' 700;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);
  }
  .nav-links{display:flex;gap:26px}
  .nav-links a{
    color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;
    letter-spacing:.02em;
  }
  .nav-links a:hover,.nav-links a:focus-visible{color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  /* ---------- Hero ---------- */
  header{position:relative;overflow:hidden}
  .hero{
    position:relative;
    padding:96px 24px 110px;
    max-width:var(--max);margin:0 auto;
  }
  .hero-photo{
    position:absolute;right:24px;top:50%;
    transform:translateY(-50%);
    width:300px;height:380px;
    object-fit:cover;
    border-radius:18px;
    box-shadow:0 16px 40px rgba(19,26,36,.12);
    z-index:0;
  }
  .hero-content{position:relative;z-index:1;max-width:640px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--slate);margin-bottom:22px;
  }
  .eyebrow::before{content:'';width:28px;height:2px;background:var(--accent)}
  .eyebrow .zh{font-family:'Noto Serif SC',serif;font-weight:600;letter-spacing:.3em;text-transform:none}
  h1{
    font-family:'Archivo',sans-serif;
    font-variation-settings:'wdth' 115,'wght' 850;
    font-size:clamp(44px,7.5vw,84px);
    line-height:1.02;letter-spacing:-.01em;
    margin-bottom:26px;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .hero-sub{font-size:18px;max-width:520px;color:#4A5568;margin-bottom:34px}
  .hero-meta{
    display:flex;flex-wrap:wrap;gap:10px 28px;
    font-size:13.5px;font-weight:500;color:var(--slate);
  }
  .hero-meta span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

  /* ---------- Sections ---------- */
  section{padding:78px 0;border-top:1px solid var(--mist)}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:44px}
  .sec-zh{
    font-family:'Noto Serif SC',serif;font-weight:900;
    font-size:30px;color:var(--accent);line-height:1;
  }
  .sec-en{
    font-family:'Archivo',sans-serif;
    font-variation-settings:'wdth' 120,'wght' 750;
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);
  }

  /* ---------- Work cards ---------- */
